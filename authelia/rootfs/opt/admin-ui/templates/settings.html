{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>

<form method="post" class="form">
  <h2>Domain &amp; portal</h2>
  <label>Root domain
    <input type="text" name="domain" value="{{ domain }}" placeholder="example.com" required>
    <small>Session cookies are issued for this domain and all its subdomains.</small>
  </label>
  <label>Portal URL
    <input type="url" name="authelia_url" value="{{ authelia_url }}" placeholder="https://auth.example.com" required>
    <small>The public URL where the Authelia portal is reachable.</small>
  </label>
  <label>Default redirection URL
    <input type="url" name="default_redirection_url" value="{{ default_redirection_url }}" placeholder="https://home.example.com (optional)">
    <small>Where users land after logging in directly at the portal.</small>
  </label>

  <h2>Sessions</h2>
  <div class="row">
    <label>Expiration
      <input type="text" name="expiration" value="{{ expiration }}">
    </label>
    <label>Inactivity timeout
      <input type="text" name="inactivity" value="{{ inactivity }}">
    </label>
    <label>Remember me
      <input type="text" name="remember_me" value="{{ remember_me }}">
    </label>
  </div>
  <small>Durations use Authelia notation, e.g. <code>5m</code>, <code>1h</code>, <code>1M</code>.</small>

  <h2>Security</h2>
  <div class="row">
    <label>TOTP issuer
      <input type="text" name="totp_issuer" value="{{ totp_issuer }}">
    </label>
    <label>Max login retries
      <input type="number" name="max_retries" value="{{ max_retries }}" min="1" max="10">
    </label>
    <label>Find time
      <input type="text" name="find_time" value="{{ find_time }}">
    </label>
    <label>Ban time
      <input type="text" name="ban_time" value="{{ ban_time }}">
    </label>
  </div>

  <h2>Logging</h2>
  <label>Log level
    <select name="log_level">
      {% for level in log_levels %}
      <option value="{{ level }}" {% if level == log_level %}selected{% endif %}>{{ level }}</option>
      {% endfor %}
    </select>
  </label>

  <button type="submit" class="btn btn-primary">Save settings</button>
</form>
{% endblock %}
