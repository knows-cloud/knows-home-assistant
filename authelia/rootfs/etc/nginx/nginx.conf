# Front proxy for the Authelia portal. It exists for exactly one reason:
# injecting /addon-portal.css (the user's custom stylesheet from
# /config/assets/custom.css) into the portal pages, which Authelia does not
# support natively. Everything else is passed through untouched.

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_max_body_size 16m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 9091;

        location = /addon-portal.css {
            default_type text/css;
            add_header Cache-Control "no-cache";
            root /config/assets;
            try_files /custom.css @empty_css;
        }

        location @empty_css {
            default_type text/css;
            return 200 "";
        }

        location / {
            proxy_pass http://127.0.0.1:9092;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # sub_filter cannot rewrite compressed responses
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<link rel="stylesheet" type="text/css" href="/addon-portal.css"></head>';
            sub_filter_once on;
        }
    }
}
