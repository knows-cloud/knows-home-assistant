name: Better Authelia
version: 1.1.2
slug: better_authelia
description: Authelia SSO server with a full admin UI for settings, users, access control and branding
url: https://github.com/knows-cloud/knows-home-assistant
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
ingress: true
